<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3a2a8a"/>
      <stop offset="60%" stop-color="#1a1850"/>
      <stop offset="100%" stop-color="#0a0a3a"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a8d8ff"/>
      <stop offset="65%" stop-color="#5078d0"/>
      <stop offset="100%" stop-color="#16308a"/>
    </radialGradient>
    <radialGradient id="saturn" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="65%" stop-color="#d8b070"/>
      <stop offset="100%" stop-color="#8a5828"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6a8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>

  <!-- background stars -->
  <g fill="white" opacity="0.85">
    <circle cx="80"  cy="70"  r="2.4"/>
    <circle cx="420" cy="55"  r="3"/>
    <circle cx="60"  cy="260" r="2"/>
    <circle cx="260" cy="120" r="1.8"/>
    <circle cx="180" cy="220" r="2"/>
    <circle cx="350" cy="240" r="2.4"/>
    <circle cx="460" cy="380" r="2.2"/>
    <circle cx="140" cy="430" r="1.8"/>
  </g>

  <!-- dashed glowing trail from Earth to Saturn -->
  <path d="M 130 400 Q 200 250, 280 270 T 400 130"
        stroke="#ffe6a8" stroke-width="6" stroke-linecap="round" fill="none"
        stroke-dasharray="14 14" opacity="0.9"
        style="filter: drop-shadow(0 0 10px rgba(255,230,168,0.75))"/>

  <!-- checkpoint stars along the trail -->
  <g fill="#fff8c8">
    <path d="M 195 305 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 z"/>
    <path d="M 290 230 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 z"/>
    <path d="M 360 180 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 z"/>
  </g>

  <!-- Earth (bottom-left) -->
  <circle cx="130" cy="400" r="84" fill="url(#halo)" opacity="0.5"/>
  <circle cx="130" cy="400" r="60" fill="url(#earth)"/>
  <g opacity="0.85" fill="#5da050">
    <ellipse cx="116" cy="392" rx="22" ry="14" transform="rotate(20 116 392)"/>
    <ellipse cx="146" cy="412" rx="18" ry="11" transform="rotate(-20 146 412)"/>
    <ellipse cx="132" cy="372" rx="11" ry="6" transform="rotate(15 132 372)"/>
  </g>
  <ellipse cx="120" cy="370" rx="26" ry="6" fill="white" opacity="0.45"/>
  <circle cx="110" cy="378" r="11" fill="white" opacity="0.45"/>
  <circle cx="130" cy="400" r="60" fill="none" stroke="#a8d8ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Saturn (top-right) -->
  <circle cx="400" cy="130" r="90" fill="url(#halo)" opacity="0.55"/>
  <!-- back of ring -->
  <ellipse cx="400" cy="130" rx="105" ry="30" fill="none"
           stroke="#e6c890" stroke-width="9" stroke-opacity="0.85"
           stroke-dasharray="200 360" stroke-dashoffset="0"
           transform="rotate(-18 400 130)"/>
  <!-- planet body -->
  <circle cx="400" cy="130" r="56" fill="url(#saturn)"/>
  <!-- bands -->
  <g opacity="0.45">
    <rect x="344" y="106" width="112" height="10" fill="#a87830"/>
    <rect x="344" y="130" width="112" height="14" fill="#7a4818"/>
    <rect x="344" y="152" width="112" height="8"  fill="#a87830"/>
  </g>
  <!-- front of ring -->
  <ellipse cx="400" cy="130" rx="105" ry="30" fill="none"
           stroke="#f0d8a0" stroke-width="9" stroke-opacity="0.95"
           stroke-dasharray="200 360" stroke-dashoffset="-200"
           transform="rotate(-18 400 130)"/>
  <circle cx="400" cy="130" r="56" fill="none" stroke="#fff5d6" stroke-width="2" stroke-opacity="0.5"/>
  <!-- shine -->
  <circle cx="380" cy="110" r="10" fill="white" opacity="0.5"/>
</svg>
